name: test

on:
  push:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ "20" ]
        shard: [ 1, 2, 3, 4 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests 15 times
        shell: bash
        run: |
          for i in $(seq 1 15); do
            if ! npm test > test.log 2>&1; then
              msg=$(grep -nE "not ok|Error|expected|actual|at .*test/|operator|code:" test.log | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=run $i failed::$msg"
              exit 1
            fi
          done
