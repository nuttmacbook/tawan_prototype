# Runs the tests on every push and pull request. They need no npm packages and no Claude,
# so nothing is installed: just Node.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ "20", "22" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: for f in server/*.js scripts/*.js src/*.js src/components/*.js public/sw.js; do node --check "$f"; done
      - name: Tests
        run: npm test
